[project]
name = "whis"
version = "0.1.0"
description = "Agente pessoal local: diário, daily, jornal e busca, com um vault Obsidian como memória durável."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pystray>=0.19.5",          # ícone na bandeja do Windows
    "Pillow>=10.0",             # imagem do ícone da bandeja
    "httpx>=0.27",              # chamadas HTTP (Linear, Slack, feeds do jornal)
    "claude-agent-sdk>=0.2.140",  # o Claude da conta do usuário (OAuth); 0.2.140 traz o ResultError do limite do plano
    "mcp>=2.0",                 # o MCP oficial da Granola (reuniões), com OAuth
    "slack_sdk>=3.27",          # a DM do agente por Socket Mode (sem porta aberta)
    "pywin32>=306; sys_platform == 'win32'",  # RegisterHotKey, clipboard e DPAPI (no Mac: Carbon, pbcopy, Keychain)
    "cryptography>=42",         # o cofre no macOS: Fernet com a chave no Keychain
    "playwright>=1.47",         # o X do jornal, lido pelo Chrome instalado (sem baixar navegador)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
whis = "whis.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whis = ["*.ps1", "*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not rede\""
markers = [
    "rede: teste que fala com um serviço externo real (Claude, Linear, Slack); nao roda por padrao",
]
